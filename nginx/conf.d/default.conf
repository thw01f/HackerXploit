# No static upstream {} blocks: those resolve web/ctfd's container IP once,
# at nginx startup, so any later container recreation (redeploy, rebuild)
# leaves nginx silently 502ing against the old IP until manually restarted.
# Each location below sets a $upstream_* variable instead, which forces
# nginx to re-resolve the hostname per request via the resolver directive in
# nginx.conf (Docker's embedded DNS).

# -------------------------------------------------------------------
# hackerxploit.org (bare root + www.) is intentionally NOT configured
# anywhere in this file. It's reserved for other, unrelated projects -
# this compose stack claims only club.hackerxploit.org and
# arena.hackerxploit.org. Nothing here proxies or serves anything for
# the bare domain; whatever gets deployed there is managed separately.
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# 1. Main Club Application Portal + Shared Auth/SSO (club.hackerxploit.org)
#
# Everything the platform needs lives on this one domain now, including
# login/register/OAuth - there's no separate auth subdomain to keep in
# sync, and the session cookie only ever needs to be scoped here (see
# SESSION_COOKIE_DOMAIN in backend/app/config.py), not shared across
# hackerxploit.org or any future unrelated subdomain.
# -------------------------------------------------------------------
server {
    listen 80;
    listen 443 ssl;
    server_name club.hackerxploit.org localhost 127.0.0.1;

    # Certbot SSL certificate paths (wildcard *.hackerxploit.org)
    ssl_certificate /etc/letsencrypt/live/hackerxploit.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hackerxploit.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location /socket.io/ {
        set $upstream_web http://web:5000;
        proxy_pass $upstream_web/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Covers every /api/ route including /api/auth/* and /api/health -
    # auth is no longer split onto a separate domain, so this one prefix
    # is sufficient.
    location /api/ {
        set $upstream_web http://web:5000;
        proxy_pass $upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth2/SSO provider (CTFd's "Login with HackerXploit" redirects
    # browsers here for /oauth/authorize; /oauth/token and /oauth/userinfo
    # are called server-to-server over the Docker network, not through
    # this domain at all - see scripts/init_ctfd.py).
    location /oauth/ {
        set $upstream_web http://web:5000;
        proxy_pass $upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        alias /var/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Gated attachment serving via Nginx internal redirect
    location /internal_uploads/ {
        internal;
        alias /var/uploads/;
    }

    location / {
        # No cookie-presence redirect here (there used to be one, bouncing
        # to a separate auth domain) - login now lives on this same domain,
        # so that check would infinite-loop against /login itself. Vue
        # Router's own auth guard (frontend/src/App.vue) already gates
        # every non-public route client-side.
        root /var/www/frontend;
        try_files $uri $uri/ /index.html;
    }
}

# -------------------------------------------------------------------
# 2. CTFd CTF Platform (arena.hackerxploit.org)
# -------------------------------------------------------------------
server {
    listen 80;
    listen 443 ssl;
    server_name arena.hackerxploit.org;

    ssl_certificate /etc/letsencrypt/live/hackerxploit.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hackerxploit.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        set $upstream_ctfd http://ctfd:8000;
        proxy_pass $upstream_ctfd;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 500M;
    }
}
