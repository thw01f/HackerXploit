# Upstream services
upstream flask_backend {
    server web:5000;
}

upstream ctfd_backend {
    server ctfd:8000;
}

# 1. Main Public Site & Auth Provider (hackerxploit.org)
server {
    listen 80;
    server_name hackerxploit.org www.hackerxploit.org localhost;

    location /api/ {
        proxy_pass http://flask_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /oauth/ {
        proxy_pass http://flask_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        alias /var/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        root /var/www/frontend;
        try_files $uri $uri/ /index.html;
    }
}

# 2. Main Club Application Portal (club.hackerxploit.org)
server {
    listen 80;
    server_name club.hackerxploit.org;

    location /socket.io/ {
        proxy_pass http://flask_backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://flask_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        alias /var/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        root /var/www/frontend;
        try_files $uri $uri/ /index.html;
    }
}

# 3. CTFd CTF Platform (ctf.hackerxploit.org)
server {
    listen 80;
    server_name ctf.hackerxploit.org;

    location / {
        proxy_pass http://ctfd_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 500M;
    }
}
