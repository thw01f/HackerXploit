# Upstream services
upstream flask_backend {
    server web:5000;
}

upstream ctfd_backend {
    server ctfd:8000;
}

# -------------------------------------------------------------------
# 1. Main Public Site & Auth Provider (hackerxploit.org)
# -------------------------------------------------------------------
server {
    listen 80;
    listen 443 ssl;
    server_name hackerxploit.org www.hackerxploit.org localhost 127.0.0.1;

    # Certbot SSL certificate paths (wildcard *.hackerxploit.org)
    ssl_certificate /etc/letsencrypt/live/hackerxploit.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hackerxploit.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location /api/ {
        proxy_pass http://flask_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /oauth/ {
        proxy_pass http://flask_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        alias /var/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Gated attachment serving via Nginx internal redirect
    location /internal_uploads/ {
        internal;
        alias /var/uploads/;
    }

    location / {
        root /var/www/frontend;
        try_files $uri $uri/ /index.html;
    }
}

# -------------------------------------------------------------------
# 2. Main Club Application Portal (club.hackerxploit.org)
# -------------------------------------------------------------------
server {
    listen 80;
    listen 443 ssl;
    server_name club.hackerxploit.org;

    ssl_certificate /etc/letsencrypt/live/hackerxploit.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hackerxploit.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /socket.io/ {
        proxy_pass http://flask_backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://flask_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        alias /var/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Gated attachment serving via Nginx internal redirect
    location /internal_uploads/ {
        internal;
        alias /var/uploads/;
    }

    location / {
        # Belt-and-suspenders session verification layer:
        # Check if session cookie is present on club subdomain requests.
        # If missing and accessing non-public assets, redirect to auth site.
        if ($http_cookie !~* "session=") {
            return 302 $scheme://hackerxploit.org/login?redirect=$scheme://$host$request_uri;
        }

        root /var/www/frontend;
        try_files $uri $uri/ /index.html;
    }
}

# -------------------------------------------------------------------
# 3. CTFd CTF Platform (arena.hackerxploit.org)
# -------------------------------------------------------------------
server {
    listen 80;
    listen 443 ssl;
    server_name arena.hackerxploit.org;

    ssl_certificate /etc/letsencrypt/live/hackerxploit.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hackerxploit.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://ctfd_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 500M;
    }
}
