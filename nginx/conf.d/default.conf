# Upstream services
upstream flask_backend {
    server web:5000;
}

upstream ctfd_backend {
    server ctfd:8000;
}

# -------------------------------------------------------------------
# 1. Shared Auth Provider ONLY (hackerxploit.org)
#
# This domain is reserved for other future use (a separate site/landing
# page) and must NOT serve the club app or any of its data - it exists
# solely as the common OAuth2/SSO + login entry point that club. (and
# potentially other future subdomains) redirect back to. Only /oauth/
# and /api/auth/ are proxied here; every other /api/ route, /uploads/,
# and generic app data live exclusively on club.hackerxploit.org. The
# frontend SPA is still served here (try_files -> index.html) purely so
# /login, /register, /forgot-password, /onboarding, and /setup-admin
# render - Vue Router's own auth guard keeps every other page from
# doing anything useful even if visited directly, since none of their
# data-fetching calls are reachable on this domain.
# -------------------------------------------------------------------
server {
    listen 80;
    listen 443 ssl;
    server_name hackerxploit.org www.hackerxploit.org;

    # Certbot SSL certificate paths (wildcard *.hackerxploit.org)
    ssl_certificate /etc/letsencrypt/live/hackerxploit.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hackerxploit.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location /api/auth/ {
        proxy_pass http://flask_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Exact-match only (no trailing slash) - operational monitoring, not app
    # data, so it's fine to keep reachable here per DEPLOYMENT.md's uptime
    # check for this subdomain. Does not open up the rest of /api/.
    location = /api/health {
        proxy_pass http://flask_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /oauth/ {
        proxy_pass http://flask_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /var/www/frontend;
        try_files $uri $uri/ /index.html;
    }
}

# -------------------------------------------------------------------
# 2. Main Club Application Portal (club.hackerxploit.org)
# -------------------------------------------------------------------
server {
    listen 80;
    listen 443 ssl;
    server_name club.hackerxploit.org localhost 127.0.0.1;

    ssl_certificate /etc/letsencrypt/live/hackerxploit.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hackerxploit.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /socket.io/ {
        proxy_pass http://flask_backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://flask_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        alias /var/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Gated attachment serving via Nginx internal redirect
    location /internal_uploads/ {
        internal;
        alias /var/uploads/;
    }

    location / {
        # Belt-and-suspenders session verification layer:
        # Check if session cookie is present on club subdomain requests.
        # If missing and accessing non-public assets, redirect to auth site.
        if ($http_cookie !~* "session_token=") {
            return 302 $scheme://hackerxploit.org/login?redirect=$scheme://$host$request_uri;
        }

        root /var/www/frontend;
        try_files $uri $uri/ /index.html;
    }
}

# -------------------------------------------------------------------
# 3. CTFd CTF Platform (arena.hackerxploit.org)
# -------------------------------------------------------------------
server {
    listen 80;
    listen 443 ssl;
    server_name arena.hackerxploit.org;

    ssl_certificate /etc/letsencrypt/live/hackerxploit.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hackerxploit.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://ctfd_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 500M;
    }
}
