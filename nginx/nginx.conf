user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Docker's embedded DNS server. A static `upstream {}` block (the
    # previous approach) resolves web/ctfd's container IP exactly once, at
    # nginx startup - every later container recreation (a redeploy, an
    # image rebuild) gets a new IP that nginx keeps trying the old one for
    # until it's manually restarted, silently 502ing the whole time.
    # conf.d/default.conf uses a variable in proxy_pass instead, which
    # forces nginx to re-resolve through this resolver on every request.
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/conf.d/*.conf;
}
