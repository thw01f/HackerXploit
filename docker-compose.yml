version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: hx_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./frontend/dist:/var/www/frontend:ro
      - uploads_data:/var/uploads:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - web
      - ctfd
    restart: always

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hx_web
    command: gunicorn --worker-class gevent -w 2 -b 0.0.0.0:5000 run:app
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://hx_user:hx_secure_password_123!@db:5432/hackerxploit}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:-super-secret-production-key-change-me-in-prod}
      - SESSION_COOKIE_DOMAIN=${SESSION_COOKIE_DOMAIN:-.hackerxploit.org}
      - UPLOAD_FOLDER=/var/uploads
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - SENTRY_DSN=${SENTRY_DSN:-}
    volumes:
      - uploads_data:/var/uploads
    depends_on:
      - db
      - redis
      - clamav
    restart: always

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hx_celery_worker
    command: celery -A celery_app.celery worker --loglevel=info
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://hx_user:hx_secure_password_123!@db:5432/hackerxploit}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:-super-secret-production-key-change-me-in-prod}
      - UPLOAD_FOLDER=/var/uploads
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - SENTRY_DSN=${SENTRY_DSN:-}
    volumes:
      - uploads_data:/var/uploads
    depends_on:
      - db
      - redis
      - clamav
    restart: always

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hx_celery_beat
    command: celery -A celery_app.celery beat --loglevel=info
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://hx_user:hx_secure_password_123!@db:5432/hackerxploit}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:-super-secret-production-key-change-me-in-prod}
      - SENTRY_DSN=${SENTRY_DSN:-}
    depends_on:
      - db
      - redis
    restart: always

  db:
    image: postgres:16-alpine
    container_name: hx_postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-hackerxploit}
      - POSTGRES_USER=${POSTGRES_USER:-hx_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-hx_secure_password_123!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always

  redis:
    image: redis:7-alpine
    container_name: hx_redis
    ports:
      - "6379:6379"
    restart: always

  clamav:
    image: clamav/clamav:latest
    container_name: hx_clamav
    restart: always

  ctfd:
    image: ctfd/ctfd:latest
    container_name: hx_ctfd
    ports:
      - "8000:8000"
    environment:
      - UPLOAD_FOLDER=/var/uploads/ctfd
      - DATABASE_URL=sqlite:////tmp/ctfd.db
      - REDIS_URL=redis://redis:6379/1
      - REVERSE_PROXY=true
    volumes:
      - ctfd_data:/var/uploads/ctfd
    depends_on:
      - redis
    restart: always

volumes:
  postgres_data:
  uploads_data:
  ctfd_data:
  certbot_certs:
