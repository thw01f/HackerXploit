version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: hx_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./frontend/dist:/var/www/frontend:ro
      - uploads_data:/var/uploads:ro
      # Host bind mount, not a named volume: Certbot runs directly on the
      # host (see DEPLOYMENT.md Step 3), so the real certificate lives at
      # the host's /etc/letsencrypt - a named volume here would be an empty,
      # disconnected Docker-managed volume nginx can never find anything in.
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
      - ctfd
    restart: always

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hx_web
    command: gunicorn --worker-class gevent -w 2 -b 0.0.0.0:5000 run:app
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
      - REDIS_URL=${REDIS_URL:?REDIS_URL must be set}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - SESSION_COOKIE_DOMAIN=${SESSION_COOKIE_DOMAIN:-.club.hackerxploit.org}
      - UPLOAD_FOLDER=/var/uploads
      - BACKUP_FOLDER=/var/hx_backups
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - SENTRY_DSN=${SENTRY_DSN:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-1x0000000000000000000000000000000AA}
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
    volumes:
      - uploads_data:/var/uploads
      - backups_data:/var/hx_backups
    depends_on:
      - db
      - redis
      - clamav
    restart: always

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hx_celery_worker
    command: celery -A celery_app.celery worker --loglevel=info
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
      - REDIS_URL=${REDIS_URL:?REDIS_URL must be set}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - UPLOAD_FOLDER=/var/uploads
      - BACKUP_FOLDER=/var/hx_backups
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - SENTRY_DSN=${SENTRY_DSN:-}
    volumes:
      - uploads_data:/var/uploads
      - backups_data:/var/hx_backups
    depends_on:
      - db
      - redis
      - clamav
    restart: always

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hx_celery_beat
    command: celery -A celery_app.celery beat --loglevel=info
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
      - REDIS_URL=${REDIS_URL:?REDIS_URL must be set}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - SENTRY_DSN=${SENTRY_DSN:-}
    depends_on:
      - db
      - redis
    restart: always

  db:
    image: postgres:16-alpine
    container_name: hx_postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-hackerxploit}
      - POSTGRES_USER=${POSTGRES_USER:-hx_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not published to the host: only reachable by other containers on this
    # compose network. Use `docker compose exec db psql ...` for local access.
    restart: always

  redis:
    image: redis:7-alpine
    container_name: hx_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    # Not published to the host: only reachable by other containers on this compose network.
    restart: always

  clamav:
    image: clamav/clamav:latest
    container_name: hx_clamav
    restart: always

  ctfd:
    image: ctfd/ctfd:latest
    container_name: hx_ctfd
    ports:
      # Bound to loopback only, not 0.0.0.0 - CTFd runs with REVERSE_PROXY=true
      # and trusts X-Forwarded-For/X-Forwarded-Proto from whoever connects to
      # it directly, so a publicly reachable :8000 would let an attacker
      # bypass nginx entirely (no TLS/HSTS/security headers) and spoof their
      # source IP to undermine CTFd's own rate-limiting/ban logic. Still
      # reachable as localhost:8000 for local dev (see DashboardView.vue's
      # ctfdUrl fallback) since that's from the same host.
      - "127.0.0.1:8000:8000"
    environment:
      - UPLOAD_FOLDER=/var/uploads/ctfd
      # Previously sqlite:////tmp/ctfd.db - /tmp lives only in the container's
      # writable layer, so every user/challenge/score was wiped on any container
      # recreation (image update, `down`+`up`, `docker rm`), not just a restart.
      # Now on the ctfd_db_data named volume, which survives recreation.
      - DATABASE_URL=sqlite:////var/ctfd_data/ctfd.db
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/1
      - REVERSE_PROXY=true
    volumes:
      - ctfd_data:/var/uploads/ctfd
      - ctfd_db_data:/var/ctfd_data
    depends_on:
      - redis
    restart: always

volumes:
  postgres_data:
  uploads_data:
  backups_data:
  ctfd_data:
  ctfd_db_data:
